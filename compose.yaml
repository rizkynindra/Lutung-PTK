services:
  lutung:
    build: .
    environment:
      LUTUNG_DEMO_MODE: "${LUTUNG_DEMO_MODE:-true}"
      LUTUNG_ALLOWED_HOSTS: "${LUTUNG_ALLOWED_HOSTS:-localhost,127.0.0.1}"
      LUTUNG_RATE_LIMIT: "${LUTUNG_RATE_LIMIT:-20}"
      OCR_KTP_API_URL: "${OCR_KTP_API_URL:-}"
      OCR_KTP_API_TOKEN: "${OCR_KTP_API_TOKEN:-}"
      GENERAL_OCR_API_URL: "${GENERAL_OCR_API_URL:-}"
      GENERAL_OCR_API_TOKEN: "${GENERAL_OCR_API_TOKEN:-}"
      DOCUMENT_DETECTION_API_URL: "${DOCUMENT_DETECTION_API_URL:-}"
      DOCUMENT_DETECTION_API_TOKEN: "${DOCUMENT_DETECTION_API_TOKEN:-}"
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
