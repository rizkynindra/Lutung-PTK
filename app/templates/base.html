<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portal teknologi Platform Teknologi & Keamanan">
  <title>{{ title }} | LUTUNG PTK</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
  <script src="{{ url_for('static', path='/app.js') }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#content">Lewati ke konten</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="/" aria-label="LUTUNG PTK, beranda">
        <span class="wordmark-mark" aria-hidden="true">L</span>
        <span>LUTUNG <strong>PTK</strong></span>
      </a>
      <nav aria-label="Navigasi utama">
        <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Beranda</a>
        <a href="/technologies" {% if request.url.path.startswith('/technologies') %}aria-current="page"{% endif %}>Teknologi</a>
        <a href="/api" {% if request.url.path.startswith('/api') and not request.url.path.startswith('/api/v1') %}aria-current="page"{% endif %}>API</a>
      </nav>
    </div>
  </header>

  {% if demo_mode %}
  <div class="demo-banner" role="status">
    Mode demo aktif. Hasil pemrosesan adalah data contoh, bukan keluaran layanan produksi.
  </div>
  {% endif %}

  <main id="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
